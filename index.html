<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetFutebol | Apostas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>BetFutebol</h1>
        <p>Aposte no vencedor! Sorteio: 22/12/2025</p>
    </header>

    <button id="connectWalletBtn">Conectar Metamask</button>
    <p id="walletInfo"></p>

    <section id="bet-section">
        <div class="team">
            <h3>FLAMENGO</h3>
            <img src="images/flamengo.png" alt="Flamengo">
            <input type="text" id="betFlamengo" placeholder="Valor (ETH)">
            <button id="betFlamengoBtn">Apostar</button>
        </div>

        <div class="team">
            <h3>SPFC</h3>
            <img src="images/spfc.png" alt="SPFC">
            <input type="text" id="betSPFC" placeholder="Valor (ETH)">
            <button id="betSPFCBtn">Apostar</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
